<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#b7791f" stop-opacity="0.35"/>
      <stop offset="36%" stop-color="#451a03" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020203" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111113"/>
      <stop offset="42%" stop-color="#070708"/>
      <stop offset="100%" stop-color="#020203"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#92400e" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#goldGlow)"/>

  <!-- distant city haze -->
  <ellipse cx="760" cy="610" rx="640" ry="110" fill="#f59e0b" opacity="0.08" filter="url(#blur)"/>
  <ellipse cx="820" cy="470" rx="480" ry="80" fill="#9ca3af" opacity="0.07" filter="url(#blur)"/>

  <!-- skyline -->
  <g opacity="0.78">
    <rect x="34" y="468" width="82" height="332" fill="#050506"/>
    <rect x="136" y="402" width="120" height="398" fill="#060607"/>
    <rect x="286" y="510" width="90" height="290" fill="#040405"/>
    <rect x="405" y="356" width="126" height="444" fill="#070707"/>
    <rect x="555" y="455" width="96" height="345" fill="#050506"/>
    <rect x="676" y="295" width="150" height="505" fill="#050506"/>
    <polygon points="751,235 826,295 676,295" fill="#060607"/>
    <rect x="855" y="410" width="122" height="390" fill="#060607"/>
    <rect x="1002" y="340" width="104" height="460" fill="#050506"/>
    <rect x="1130" y="500" width="152" height="300" fill="#040405"/>
    <rect x="1306" y="390" width="96" height="410" fill="#060607"/>
    <rect x="1426" y="454" width="130" height="346" fill="#050506"/>
  </g>

  <!-- window lights -->
  <g fill="url(#windowGlow)" opacity="0.52">
    <g transform="translate(58 500)"><rect width="8" height="24"/><rect x="25" y="34" width="8" height="20"/><rect x="48" y="77" width="8" height="18"/><rect x="5" y="132" width="8" height="19"/><rect x="52" y="180" width="8" height="22"/></g>
    <g transform="translate(166 438)"><rect width="9" height="18"/><rect x="33" y="44" width="9" height="22"/><rect x="72" y="82" width="9" height="17"/><rect x="20" y="126" width="9" height="21"/><rect x="81" y="180" width="9" height="20"/><rect x="42" y="238" width="9" height="18"/></g>
    <g transform="translate(428 390)"><rect width="9" height="24"/><rect x="40" y="38" width="9" height="18"/><rect x="76" y="96" width="9" height="22"/><rect x="16" y="142" width="9" height="18"/><rect x="86" y="210" width="9" height="24"/><rect x="48" y="292" width="9" height="18"/></g>
    <g transform="translate(704 335)"><rect width="10" height="26"/><rect x="38" y="44" width="10" height="20"/><rect x="78" y="92" width="10" height="24"/><rect x="22" y="158" width="10" height="18"/><rect x="96" y="232" width="10" height="24"/><rect x="48" y="315" width="10" height="18"/></g>
    <g transform="translate(1030 375)"><rect width="8" height="22"/><rect x="38" y="50" width="8" height="18"/><rect x="66" y="118" width="8" height="22"/><rect x="20" y="202" width="8" height="18"/><rect x="72" y="286" width="8" height="20"/></g>
    <g transform="translate(1331 430)"><rect width="8" height="24"/><rect x="34" y="50" width="8" height="19"/><rect x="60" y="126" width="8" height="20"/><rect x="14" y="210" width="8" height="18"/></g>
  </g>

  <!-- rain streaks -->
  <g stroke="#fef3c7" stroke-width="1.3" opacity="0.08">
    <line x1="112" y1="30" x2="82" y2="142"/><line x1="286" y1="0" x2="251" y2="139"/><line x1="498" y1="18" x2="466" y2="118"/><line x1="708" y1="0" x2="670" y2="148"/><line x1="904" y1="22" x2="872" y2="122"/><line x1="1180" y1="0" x2="1144" y2="130"/><line x1="1480" y1="34" x2="1442" y2="166"/>
  </g>

  <!-- foreground boss silhouette -->
  <g transform="translate(770 395)">
    <ellipse cx="30" cy="48" rx="28" ry="34" fill="#010102"/>
    <path d="M-55 190 C-48 112 -12 78 30 78 C72 78 107 112 116 190 L132 362 L-76 362 Z" fill="#010102"/>
    <path d="M-28 102 C0 138 52 138 88 102 L105 172 C57 196 -7 197 -49 172 Z" fill="#09090b" opacity="0.72"/>
    <path d="M-54 180 C-126 228 -160 312 -174 420 L-85 420 Z" fill="#010102"/>
    <path d="M116 180 C188 228 222 312 236 420 L147 420 Z" fill="#010102"/>
    <path d="M30 79 L6 362" stroke="#c0841a" stroke-width="3" opacity="0.24"/>
  </g>

  <!-- floor/reflection -->
  <path d="M0 710 C320 650 618 668 834 705 C1112 754 1334 735 1600 690 L1600 900 L0 900 Z" fill="#020203" opacity="0.78"/>
  <ellipse cx="810" cy="778" rx="460" ry="64" fill="#f59e0b" opacity="0.06" filter="url(#blur)"/>

  <!-- vignette -->
  <rect width="1600" height="900" fill="none" stroke="#000" stroke-width="140" opacity="0.48"/>
  <rect width="1600" height="900" fill="#000" opacity="0.18"/>
</svg>
